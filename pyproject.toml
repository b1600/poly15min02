[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poly15m"
version = "0.1.0"
description = "15m BTC Up/Down Polymarket bot"
requires-python = ">=3.10"
dependencies = [
    "py-clob-client>=0.23",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
poly15m-record = "poly15m.record:main"
poly15m-paper-signals = "poly15m.paper_signals:main"
poly15m-paper-trade = "poly15m.paper_trade:main"
poly15m-live-trade = "poly15m.live_trade:main"
poly15m-backtest = "poly15m.backtest.cli:main"
poly15m-sweep = "poly15m.backtest.sweep:main"
poly15m-calibrate = "poly15m.calibration.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poly15m"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
